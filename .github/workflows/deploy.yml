name: Build → Push → Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_LC: ${{ github.repository }}   # will be lowercased in steps

jobs:
  # ── Job 1: Lint + Type-check ──────────────────────────────────────────────
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

  # ── Job 2: Build Docker image + push to GHCR ──────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase — compute once and reuse
      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pre-alpha,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_AGORA_AI_AGENT_UID=999999
            NEXT_PUBLIC_APP_URL=https://instructor.sud-o.app
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to:   type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

      - name: Image summary
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.image.outputs.name }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ── Job 3: Deploy to Azure VM via SSH ─────────────────────────────────────
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build
    # No 'environment' here — avoids hanging on unregistered environment

    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     22
          source:   "docker-compose.prod.yml,Caddyfile"
          target:   "/opt/knotic"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Pass GITHUB_TOKEN into the SSH session as an env var
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:  ${{ github.actor }}
          REPO:       ${{ github.repository }}
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     22
          envs:     GHCR_TOKEN,GHCR_USER,REPO
          script: |
            set -e
            cd /opt/knotic

            echo "── Logging in to GHCR ──"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "── Loading env vars for compose interpolation ──"
            # Source .env.prod so DB_PASSWORD, REDIS_PASSWORD etc are available
            # to docker compose variable substitution (${VAR} in compose file)
            set -a
            source .env.prod
            set +a

            echo "── Validating required env vars ──"
            required_vars="DB_PASSWORD REDIS_PASSWORD BETTER_AUTH_SECRET BRAIN_SERVER_SECRET AGORA_APP_ID AGORA_APP_CERTIFICATE AGORA_REST_KEY AGORA_REST_SECRET LLM_API_KEY NEXT_PUBLIC_APP_URL BETTER_AUTH_URL DATABASE_URL REDIS_URL QDRANT_URL"
            for var in $required_vars; do
              value="$(eval "printf '%s' \"\${$var:-}\"")"
              if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ] || printf '%s' "$value" | grep -qi "openssl rand"; then
                echo "Missing or placeholder env var: $var"
                exit 1
              fi
            done

            echo "── Pulling latest image ──"
            REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY="$REPO_LOWER"
            export IMAGE_TAG=latest
            docker compose -f docker-compose.prod.yml pull app worker

            echo "── Starting services ──"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-build

            echo "── Waiting for app to be healthy ──"
            sleep 20
            docker compose -f docker-compose.prod.yml ps

            echo "── Pruning old images ──"
            docker image prune -f --filter "until=24h"

            echo "── Recent app logs ──"
            docker compose -f docker-compose.prod.yml logs app --tail=20

            echo "── Recent worker logs ──"
            docker compose -f docker-compose.prod.yml logs worker --tail=20

      - name: Deployment summary
        run: |
          echo "## ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://instructor.sud-o.app" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
